[general]
live_config_reload = true

[terminal]

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[bell]
animation = "EaseOutExpo"
color = "0xffff00"
duration = 4

# Colors: SilkCircuit Glow (https://github.com/hyperb1iss/silkcircuit, MIT)
[colors]
draw_bold_text_with_bright_colors = false

[colors.bright]
black = "0x818181"
blue = "0x66ccff"
cyan = "0x66ffff"
green = "0x66ff66"
magenta = "0xff66ff"
red = "0xff6666"
white = "0xffffff"
yellow = "0xffff66"

[colors.cursor]
cursor = "0x00ffff"
text = "0x0a0816"

[colors.normal]
black = "0x000000"
blue = "0x0099ff"
cyan = "0x00ffff"
green = "0x00ff00"
magenta = "0xff00ff"
red = "0xff2244"
white = "0xffffff"
yellow = "0xffff00"

[colors.primary]
background = "0x0a0816"
foreground = "0xffffff"

[colors.selection]
background = "0x4b0654"
text = "0xffffff"

[cursor]
style = "Block"
unfocused_hollow = true

[debug]
log_level = "Off"
persistent_logging = false
print_events = false
render_timer = false

[env]
TERM = "xterm-256color"

[font]
size = 15.5

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Medium"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Light Italic"

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Light"

[font.offset]
x = 0
y = 0

[mouse]
hide_when_typing = true

[mouse.double_click]
threshold = 300

[mouse.hints]
modifiers = "Control"

[mouse.hints.launcher]
program = "open"

[mouse.triple_click]
threshold = 300

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ''',│`|:"' ()[]{}<>'''

[terminal.shell]
args = ["new-session", "-A", "-D", "-s", "main"]
program = "/usr/bin/tmux"

[window]
decorations = "Full"
dynamic_padding = true
opacity = 1.0
startup_mode = "Windowed"

[window.dimensions]
columns = 130
lines = 45

[window.padding]
x = 5
y = 5

[keyboard]
