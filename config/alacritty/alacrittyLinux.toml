[general]
live_config_reload = true

[terminal]

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[bell]
animation = "EaseOutExpo"
color = "0xfef08a"
duration = 4

# Colors: Miami Wind (from the Omarchy theme by hanakin, MIT)
[colors]
draw_bold_text_with_bright_colors = false

[colors.bright]
black = "0x585b70"
blue = "0x2563eb"
cyan = "0x38bdf8"
green = "0x4ade80"
magenta = "0xec4899"
red = "0xf43f5e"
white = "0xa6adc8"
yellow = "0xfde047"

[colors.cursor]
cursor = "0xa6adc8"
text = "0x1e1e2e"

[colors.normal]
black = "0x1e1e2e"
blue = "0x818cf8"
cyan = "0x22d3ee"
green = "0x34d399"
magenta = "0xf472b6"
red = "0xf87171"
white = "0xcdd6f4"
yellow = "0xfef08a"

[colors.primary]
background = "0x1e1e2e"
foreground = "0xcdd6f4"

[colors.selection]
background = "0xf472b6"
text = "0x1e1e2e"

[cursor]
style = "Block"
unfocused_hollow = true

[debug]
log_level = "Off"
persistent_logging = false
print_events = false
render_timer = false

[env]
TERM = "xterm-256color"

[font]
size = 15.5

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Medium"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Light Italic"

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Light"

[font.offset]
x = 0
y = 0

[mouse]
hide_when_typing = true

[mouse.double_click]
threshold = 300

[mouse.hints]
modifiers = "Control"

[mouse.hints.launcher]
program = "open"

[mouse.triple_click]
threshold = 300

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ''',│`|:"' ()[]{}<>'''

[terminal.shell]
args = ["new-session", "-A", "-D", "-s", "main"]
program = "/usr/bin/tmux"

[window]
decorations = "Full"
dynamic_padding = true
opacity = 1.0
startup_mode = "Windowed"

[window.dimensions]
columns = 130
lines = 45

[window.padding]
x = 5
y = 5

[keyboard]
