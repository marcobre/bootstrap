# Font family. You can also specify different fonts for the
font_family      FiraCode Nerd Font Mono
italic_font      auto
bold_font        auto
bold_italic_font auto

# Font size (in pts)
font_size        11.0
force_ltr no
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# The cursor color
cursor           		#00ffff
cursor_text_color       #0a0816


url_color #00ffff
url_style curly

bell_border_color #ffff00

# Background
background_image none
background_image_layout tiled
background_image_linear no
dynamic_background_opacity no
background_tint 0.0

dim_opacity 1

# The color for the border of the active window
active_border_color #00d9ff
inactive_border_color #1a0033
inactive_text_alpha 1

# Kitty Colors (SilkCircuit Glow, https://github.com/hyperb1iss/silkcircuit, MIT)
foreground              #ffffff
background              #0a0816
background_opacity 1.0


selection_foreground    #ffffff
selection_background    #4b0654

# Tab bar colors
active_tab_foreground   #ffffff
active_tab_background   #1a0033
inactive_tab_foreground #cc66ff
inactive_tab_background #000000
tab_bar_background      #000000

active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_edge bottom
tab_bar_margin_width 0.0

tab_bar_style powerline
tab_powerline_style slanted
tab_separator " ┇"

tab_bar_margin_height 0.0 0.0
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_activity_symbol none
active_tab_title_template none
tab_bar_margin_color none

# Colors for marks (marked text in the terminal)
mark1_foreground #0a0816
mark1_background #00ffff
mark2_foreground #0a0816
mark2_background #ffff00
mark3_foreground #0a0816
mark3_background #ff00ff


# The 16 terminal colors
# black
color0 #000000
color8 #818181

# red
color1 #ff2244
color9 #ff6666

# green
color2  #00ff00
color10 #66ff66

# yellow
color3  #ffff00
color11 #ffff66

# blue
color4  #0099ff
color12 #66ccff

# magenta
color5  #ff00ff
color13 #ff66ff

# cyan
color6  #00ffff
color14 #66ffff

# white
color7  #ffffff
color15 #ffffff





