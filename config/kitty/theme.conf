# Font family. You can also specify different fonts for the
font_family      FiraCode Nerd Font Mono
italic_font      auto
bold_font        auto
bold_italic_font auto

# Font size (in pts)
font_size        11.0
force_ltr no
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# The cursor color
cursor           		#a6adc8
cursor_text_color       #1e1e2e


url_color #818cf8
url_style curly

bell_border_color #fef08a

# Background
background_image none
background_image_layout tiled
background_image_linear no
dynamic_background_opacity no
background_tint 0.0

dim_opacity 1

# The color for the border of the active window
active_border_color #818cf8
inactive_border_color #585b70
inactive_text_alpha 1

# Kitty Colors (Miami Wind, from the Omarchy theme by hanakin, MIT)
foreground              #cdd6f4
background              #1e1e2e
background_opacity 1.0


selection_foreground    #1e1e2e
selection_background    #f472b6

# Tab bar colors
active_tab_foreground   #1e1e2e
active_tab_background   #818cf8
inactive_tab_foreground #585b70
inactive_tab_background #181825
tab_bar_background      #181825

active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_edge bottom
tab_bar_margin_width 0.0

tab_bar_style powerline
tab_powerline_style slanted
tab_separator " ┇"

tab_bar_margin_height 0.0 0.0
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_activity_symbol none
active_tab_title_template none
tab_bar_margin_color none

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #22d3ee
mark2_foreground #1e1e2e
mark2_background #fef08a
mark3_foreground #1e1e2e
mark3_background #f472b6


# The 16 terminal colors
# black
color0 #1e1e2e
color8 #585b70

# red
color1 #f87171
color9 #f43f5e

# green
color2  #34d399
color10 #4ade80

# yellow
color3  #fef08a
color11 #fde047

# blue
color4  #818cf8
color12 #2563eb

# magenta
color5  #f472b6
color13 #ec4899

# cyan
color6  #22d3ee
color14 #38bdf8

# white
color7  #cdd6f4
color15 #a6adc8





