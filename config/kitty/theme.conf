# Font family. You can also specify different fonts for the
font_family      FiraCode Nerd Font Mono
italic_font      auto
bold_font        auto
bold_italic_font auto

# Font size (in pts)
font_size        11.0
force_ltr no
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# The cursor color
cursor           		#ddf7ff
cursor_text_color       #0b0c16


url_color #82fb9c
url_style curly

bell_border_color #50f7d4

# Background
background_image none
background_image_layout tiled
background_image_linear no
dynamic_background_opacity no
background_tint 0.0

dim_opacity 1

# The color for the border of the active window
active_border_color #82fb9c
inactive_border_color #2d3450
inactive_text_alpha 1

# Kitty Colors (Hackerman, Omarchy, MIT: https://github.com/omacom/omarchy/tree/dev/themes/hackerman)
foreground              #ddf7ff
background              #0b0c16
background_opacity 1.0


selection_foreground    #ddf7ff
selection_background    #1f253a

# Tab bar colors
active_tab_foreground   #0b0c16
active_tab_background   #82fb9c
inactive_tab_foreground #6a6e95
inactive_tab_background #080910
tab_bar_background      #080910

active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_edge bottom
tab_bar_margin_width 0.0

tab_bar_style powerline
tab_powerline_style slanted
tab_separator " ┇"

tab_bar_margin_height 0.0 0.0
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_activity_symbol none
active_tab_title_template none
tab_bar_margin_color none

# Colors for marks (marked text in the terminal)
mark1_foreground #0b0c16
mark1_background #7cf8f7
mark2_foreground #0b0c16
mark2_background #50f7d4
mark3_foreground #0b0c16
mark3_background #86a7df


# The 16 terminal colors
# black
color0 #0b0c16
color8 #2d3450
# red
color1 #50f872
color9 #85ff9d
# green
color2  #4fe88f
color10 #9cf7c2
# yellow
color3  #50f7d4
color11 #a4ffec
# blue
color4  #829dd4
color12 #c4d2ed
# magenta
color5  #86a7df
color13 #cddbf4
# cyan
color6  #7cf8f7
color14 #d1fffe
# white
color7  #ddf7ff
color15 #ddf7ff
